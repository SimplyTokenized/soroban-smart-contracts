[workspace]
members = [
    "crowdsale",
    "token",
    "payout"
]
resolver = "2"

[workspace.dependencies]
cargo-llvm-cov = "0.5"

[profile.release]
opt-level = "z"  # Optimize for size
overflow-checks = true
debug = false
strip = true  # Strip symbols to reduce size
lto = true    # Link Time Optimization