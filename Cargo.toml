[workspace]
members = [
    "crowdsale",
    "token",
    "payout"
]
resolver = "2"

[workspace.dependencies]
cargo-llvm-cov = "0.5"

[profile.release]
opt-level = "z"  # Optimize for size
overflow-checks = true
debug = 0
strip = "symbols"  # Strip symbols to reduce size
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true    # Link Time Optimization
