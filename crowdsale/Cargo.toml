[package]
name = "crowdsale"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SimplyTokenized/soroban-smart-contracts"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "=28.0.0"
stellar-access = "=0.8.0"
stellar-contract-utils = "=0.8.0"
stellar-macros = "=0.8.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
cargo-llvm-cov = { workspace = true }
token = { path = "../token" }
payout = { path = "../payout" }
